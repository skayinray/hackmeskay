name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  build-linux:
    needs: tests
    runs-on: ubuntu-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"
      - name: Install appimagetool
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Build AppImage
        run: bash build/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hackmeskay-linux
          path: dist/hackmeskay-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    needs: tests
    runs-on: windows-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"
      - name: Build executable
        run: powershell -ExecutionPolicy Bypass -File build/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: hackmeskay-windows
          path: dist/hackmeskay.exe
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signing dependencies
        run: python -m pip install "cryptography>=42.0"
      - name: Determine release tag
        shell: bash
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: hackmeskay-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: hackmeskay-windows
          path: dist
      - name: Write unsigned manifest
        shell: bash
        run: |
          cat > update.unsigned.json <<EOF
          {
            "version": "$VERSION",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Release $TAG.",
            "assets": {
              "windows": {
                "url": "https://github.com/skayinray/hackmeskay/releases/download/$TAG/hackmeskay.exe",
                "filename": "hackmeskay.exe"
              },
              "linux": {
                "url": "https://github.com/skayinray/hackmeskay/releases/download/$TAG/hackmeskay-x86_64.AppImage",
                "filename": "hackmeskay-x86_64.AppImage"
              }
            }
          }
          EOF
      - name: Sign manifest and artifacts
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python tools/sign_update.py --manifest update.unsigned.json --output update.json \
            dist/hackmeskay.exe dist/hackmeskay-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            update.json
            dist/*.sig
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            update.json
            dist/hackmeskay.exe
            dist/hackmeskay.exe.sig
            dist/hackmeskay-x86_64.AppImage
            dist/hackmeskay-x86_64.AppImage.sig
