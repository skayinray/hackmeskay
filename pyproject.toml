[project]
name = "hackmeskay"
version = "0.1.1"
description = "hackmeskay — кроссплатформенная текстовая хакерская MMO в терминале"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.47",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "colorama>=0.4.6; sys_platform == 'win32'",
]

[project.scripts]
hackmeskay = "hackmeskay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hackmeskay = ["../data/**/*"]
